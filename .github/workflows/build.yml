# Builds an unsigned .ipa on GitHub's Macs, so the app can be developed from Windows.
# Download the "Breadcrumb-ipa" artifact from the run and install it with Sideloadly.
name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Debug on purpose: RevenueCat Test Store keys only work in debug builds.
      # Compile errors are re-posted as annotations so they're readable without opening the log.
      - name: Build
        env:
          RC_KEY: ${{ secrets.REVENUECAT_TEST_KEY }}
        run: |
          if ! xcodebuild build -quiet \
            -project Breadcrumb.xcodeproj \
            -scheme Breadcrumb \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            REVENUECAT_API_KEY="$RC_KEY" > build.log 2>&1
          then
            grep -E ": error: " build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u > errors.txt || true
            [ -s errors.txt ] || tail -25 build.log > errors.txt
            split -l 12 errors.txt chunk_
            for chunk in chunk_*; do
              echo "::error title=Build failed::$(sed 's/%/%25/g' "$chunk" | awk '{printf "%s%%0A", $0}')"
            done
            tail -80 build.log
            exit 1
          fi
          grep -E ": warning: " build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -40 || true

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Breadcrumb.app Payload/
          zip -qry Breadcrumb.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Breadcrumb-ipa
          path: Breadcrumb.ipa
